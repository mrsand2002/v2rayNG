name: Zent Plus v2.8.1 timer source inspection
on:
  push:
    branches: ['feature/zent-v281-session-usage']
    paths: ['.github/workflows/zent-v28-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated Compose layout (non-secret identifiers only)
        env:
          ZENT_API_URL: https://zent-plus-backend-production.up.railway.app
          ZENT_VERSION_NAME: '2.8.0'
          ZENT_VERSION_CODE: '782'
        run: |
          unzip -oq zent-v22-overlay.zip -d .
          python3 scripts/zent-v23-ui-patch.py
          python3 scripts/zent-v25-managed-profile-fix.py
          python3 zent/github/apply_zent.py
          python3 scripts/zent-v26-clean-release.py
          python3 scripts/zent-v27-app-patch.py
          python3 scripts/zent-v28-app-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/ZentManagedScreen.kt')
          lines=p.read_text(encoding='utf-8').splitlines()
          words=('session','Session','Timer','timer','elapsed','Elapsed','seconds','Seconds','startTime','startAt','uptime','duration','Duration','isRunning','statsAvailable','TrafficStats','LaunchedEffect','ZentUsageTracker','onStartVpn','onStopVpn')
          matched=set()
          for i,line in enumerate(lines):
              if any(w in line for w in words):matched.update(range(max(0,i-3),min(len(lines),i+7)))
          print('=== TIMER/UI SOURCE WINDOWS ===')
          for j in sorted(matched): print(str(j+1)+': '+lines[j][:220])
          print('=== UPDATE CHECKER SOURCE ===')
          for p in sorted(Path('V2rayNG/app/src/main/java').rglob('*ZentVersion*.kt')):
              print('FILE',p)
              for j,ln in enumerate(p.read_text(encoding='utf-8').splitlines()):
                  print(f'{j+1}: {ln[:230]}')
          for p in sorted(Path('V2rayNG/app/src/main/java').rglob('*.kt')):
              if p.name.startswith('Zent'):continue
              code=p.read_text(encoding='utf-8')
              if 'ZentVersionCheck' in code or 'releases/latest' in code:
                  print('REFERENCE FILE',p)
                  for j,line in enumerate(code.splitlines()):
                      if 'ZentVersionCheck' in line or 'releases/latest' in line:
                          print(j+1,line[:230])
          print('=== IMPORTS ===')
          for j,line in enumerate(lines[:100]):
              if line.startswith('import '):print(str(j+1)+': '+line)
          PY
