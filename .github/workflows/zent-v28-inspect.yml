name: Zent Plus v2.8 source preflight
on:
  push:
    branches: ['feature/zent-v28-announcements']
    paths: ['.github/workflows/zent-v28-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated Compose layout (non-secret identifiers only)
        env:
          ZENT_API_URL: https://zent-plus-backend-production.up.railway.app
          ZENT_VERSION_NAME: '2.8.0'
          ZENT_VERSION_CODE: '782'
        run: |
          unzip -oq zent-v22-overlay.zip -d .
          python3 scripts/zent-v23-ui-patch.py
          python3 scripts/zent-v25-managed-profile-fix.py
          python3 zent/github/apply_zent.py
          python3 scripts/zent-v26-clean-release.py
          python3 scripts/zent-v27-app-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/ZentManagedScreen.kt')
          lines=p.read_text(encoding='utf-8').splitlines()
          words=('Data Usage','Dashboard','Settings','Home','InfoCard(','var statsAvailable','var accountLifetime','val pages','when (','when(', 'Navigation', 'TabRow','listOf(')
          for i,line in enumerate(lines):
              if any(w in line for w in words):
                  print('\nLINE',i+1)
                  for j in range(max(0,i-2),min(len(lines),i+5)):
                      print(j+1,lines[j][:200])
          print('COMPOSE IMPORTS\n'+'\n'.join(l for l in lines[:125] if l.startswith('import ')))
          PY
