name: Zent Plus v2.8.3 premium home source inspection (home only)
on:
  push:
    branches: ['feature/zent-v283-premium-home']
    paths: ['.github/workflows/zent-v283-inspect.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated current home composable
        env:
          ZENT_API_URL: https://zent-plus-backend-production.up.railway.app
          ZENT_VERSION_NAME: '2.8.3'
          ZENT_VERSION_CODE: '786'
        run: |
          unzip -oq zent-v22-overlay.zip -d .
          python3 scripts/zent-v23-ui-patch.py
          python3 scripts/zent-v25-managed-profile-fix.py
          python3 zent/github/apply_zent.py
          python3 scripts/zent-v26-clean-release.py
          python3 scripts/zent-v27-app-patch.py
          python3 scripts/zent-v28-app-patch.py
          python3 scripts/zent-v281-app-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/ZentManagedScreen.kt')
          lines=p.read_text(encoding='utf-8').splitlines()
          for a,b in ((1,150),(153,210),(472,607),(810,1035)):
              print(f'==== UI SOURCE {a}-{b} ====')
              for i in range(a-1,min(b,len(lines))):
                  print(f'{i+1}: {lines[i]}')
          PY
