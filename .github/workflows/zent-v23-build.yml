name: Zent Plus v2.3 — Signed Android Update

on:
  push:
    paths:
      - '.github/workflows/zent-v23-build.yml'
      - 'scripts/zent-v23-ui-patch.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout source and native submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Apply Zent Plus v2.3 update over v2.2 base
        env:
          ZENT_API_URL: https://zent-plus-backend-production.up.railway.app
          ZENT_VERSION_NAME: '2.3.0'
          ZENT_VERSION_CODE: '764'
        run: |
          test -s zent-v22-overlay.zip
          unzip -oq zent-v22-overlay.zip -d .
          python3 -m py_compile scripts/zent-v23-ui-patch.py zent/github/apply_zent.py
          python3 scripts/zent-v23-ui-patch.py
          python3 zent/github/apply_zent.py
          python3 - <<'PYVERIFY'
          from pathlib import Path
          ui = Path('V2rayNG/app/src/main/java/com/v2ray/ang/ui/main/ZentManagedScreen.kt').read_text(encoding='utf-8')
          gradle = Path('V2rayNG/app/build.gradle.kts').read_text(encoding='utf-8')
          assert 'Server Managed By Mr.මල' in ui
          assert 'private fun ZentAppearanceCard(' in ui
          assert 'RadioButton(selected = appearanceMode' not in ui
          assert 'applicationId = "com.zentplus.vpn"' in gradle
          assert 'versionCode = 764' in gradle
          assert 'versionName = "2.3.0"' in gradle
          print('v2.3 update preflight passed')
          PYVERIFY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '14742923'
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

      - name: Install NDK
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=0 --install 'ndk;30.0.16248370'
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          sed -i '/compileSdk = 37/a\ ndkVersion = "30.0.16248370"' V2rayNG/app/build.gradle.kts

      - name: Build Android tun library
        run: |
          bash compile-hevtun.sh
          cp -r libs V2rayNG/app/

      - name: Determine native Xray release
        run: |
          cd AndroidLibXrayLite
          echo "CURRENT_TAG=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"

      - name: Download Xray library
        uses: robinraju/release-downloader@v1.13
        with:
          repository: 2dust/AndroidLibXrayLite
          tag: ${{ env.CURRENT_TAG }}
          fileName: libv2ray.aar
          out-file-path: V2rayNG/app/libs/

      - name: Set up Java
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Load existing permanent release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ZENT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ZENT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ZENT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ZENT_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || {
            echo 'Release requires the four existing ZENT signing secrets.' >&2
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/zent-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/zent-signing/release.jks"
          echo "ZENT_KEYSTORE_FILE=$RUNNER_TEMP/zent-signing/release.jks" >> "$GITHUB_ENV"
          echo "ZENT_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ZENT_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ZENT_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Compile signed release APK
        working-directory: V2rayNG
        env:
          GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx3g'
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assemblePlaystoreRelease '-PABI_FILTERS=arm64-v8a' --no-daemon

      - name: Verify package, version and APK signature
        run: |
          APK="$(find V2rayNG/app/build/outputs/apk -name '*arm64-v8a*.apk' -type f | head -1)"
          test -n "$APK" && test -s "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$APK" | tee /tmp/zent-badging.txt
          grep 'package: name=' /tmp/zent-badging.txt | grep -q 'com.zentplus.vpn'
          # ABI-specific ARM64 split APKs encode the base version code 764 as 4000764.
          grep 'package: name=' /tmp/zent-badging.txt | grep -q "versionCode='4000764'"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/ZentPlus-2.3.0-arm64-release.apk

      - name: Upload signed update APK
        uses: actions/upload-artifact@v7
        with:
          name: zent-plus-v23-release-apk
          path: artifacts/ZentPlus-2.3.0-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
